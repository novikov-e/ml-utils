<div class="table-container">
	<table class="eda-table">
		<thead>
			<tr>
				{% for c in cols %}
				<th style="text-align: {{ aligns.get(c, 'left') }}">{{ c | e }}</th>
				{% endfor %}
			</tr>
		</thead>
		<tbody>
			{% for row in rows %}
			<tr>
				{% for c in cols %}
				<td style="text-align: {{ aligns.get(c, 'left') }}">{{ row.get(c, '') | e }}</td>
				{% endfor %}
			</tr>
			{% endfor %}
		</tbody>
	</table>
</div>
