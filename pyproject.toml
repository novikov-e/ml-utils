[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-utils"
version = "0.1.1"
description = "Custom Pandas accessors and ML utilities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "seaborn==0.13.2",
    "Jinja2==3.1.6"
]

[tool.setuptools]
packages = ["ml_utils"]

[tool.setuptools.package-data]
ml_utils = ["static/*"]